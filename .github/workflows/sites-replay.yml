name: Sites replay protection checks
on:
  push:
    branches: [main]
    paths:
      - 'cloud/migrations/**'
      - 'cloud/sites_bridge.py'
      - 'tests/cloud/test_sites_postgres.py'
      - '.github/workflows/sites-replay.yml'
  pull_request:
    paths:
      - 'cloud/migrations/**'
      - 'cloud/sites_bridge.py'
      - 'tests/cloud/test_sites_postgres.py'
      - '.github/workflows/sites-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        # Official image, isolated to this job. No production secret is used.
        image: postgres:17
        env:
          POSTGRES_DB: sites_replay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only-not-a-production-secret
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_replay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SITES_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only-not-a-production-secret@127.0.0.1:5432/sites_replay_test?connect_timeout=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned PostgreSQL client from official PyPI
        run: |
          python3 -m venv "$RUNNER_TEMP/sites-replay-venv"
          "$RUNNER_TEMP/sites-replay-venv/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: 'psycopg[binary]==3.2.13'
      - name: Verify atomic replay rejection and database permissions
        run: |
          "$RUNNER_TEMP/sites-replay-venv/bin/python" -B -m unittest discover -s tests/cloud -p 'test_sites_postgres.py' -v
