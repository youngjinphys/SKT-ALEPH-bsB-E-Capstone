name: Validate reviewed node observability objects
on:
  push:
    branches: [main]
    paths: [.github/workflows/node-metrics-transfer.yml]
permissions: {}
jobs:
  verify:
    if: github.repository == 'youngjinphys/SKT-ALEPH-bsB-E-Capstone' && github.event.head_commit.message == 'chore: validate reviewed node observability changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 61ab9aca102c3be8854e04e2d7ee478fd686d56e
          persist-credentials: false
      - name: Verify exact reviewed patch and resulting tree
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 --proto '=https' 'https://sb-61bglkcehcxu.vercel.run/904e143ad81d7900/node-observability.patch' -o /tmp/reviewed.patch
          echo '904e143ad81d7900d530377a289803948863f6b65fa231b12df6f074117007d1  /tmp/reviewed.patch' | sha256sum -c -
          git apply --check /tmp/reviewed.patch
          git apply --index /tmp/reviewed.patch
          test "$(git write-tree)" = '9c56ec0b9af6d7df9325ca3be53283639d3cc3bb'
          git diff --cached --check
      - name: Verify cloud and browser calculation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/node-quality-tests
          /tmp/node-quality-tests/bin/pip -q install -r requirements.txt httpx==0.28.1
          /tmp/node-quality-tests/bin/python -B -m unittest discover -s tests/cloud -v
          node --test tests/cloud/*.test.mjs
      - name: Upload verified Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          assert os.environ['REPOSITORY']=='youngjinphys/SKT-ALEPH-bsB-E-Capstone'
          expected={
            'apps/policy-server/src/policy_server/console_observability.py',
            'apps/policy-server/src/policy_server/console_quality.py',
            'apps/policy-server/src/policy_server/nodes.py',
            'apps/policy-sync/src/aleph_policy_sync/system_metrics.py',
            'apps/policy-sync/src/aleph_policy_sync/receiver.py',
            'cloud/app.py','cloud/onboarding.py','scripts/deploy/connect-node-dashboard.py',
            'tests/browser/console_smoke.py','tests/cloud/test_pin_auth.py',
            'tests/cloud/resource-quality.test.mjs','tests/cloud/test_receiver_diagnostics.py',
            'docs/node-resource-dashboard.md',
            'docs/superpowers/plans/2026-11-04-node-quality-diagnostics.md'}
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert set(paths)==expected
          result=[]
          for name in sorted(paths):
              file=pathlib.Path(name)
              assert file.is_file() and not file.is_symlink()
              data=file.read_bytes()
              digest=hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
              body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  uploaded=json.load(response)
              assert uploaded['sha']==digest
              result.append({'path':name,'sha':digest,'mode':'100644','type':'blob'})
          print('VERIFIED_BLOB_MANIFEST='+json.dumps(result,separators=(',',':')))
          print('No branches, references, production state, or deployment settings were changed by this job.')
          PY
