# Example only. Put in a root-owned NGINX site config after provisioning TLS.
# Requires HTTPS cert/key and deliberate external access policy; no database.
server {
    listen 443 ssl;
    server_name POLICY_HOST;
    ssl_certificate /etc/ssl/certs/POLICY_HOST.pem;
    ssl_certificate_key /etc/ssl/private/POLICY_HOST.key;
    server_tokens off;
    autoindex off;
    default_type application/json;

    # One immutable, signed full snapshot served under the device-specific URL.
    # Do not rely on NGINX mtime+size ETags for frequently replaced equal-size JSON.
    # This endpoint returns 200 on every request; the client also supports 304
    # from a backend with a content-addressed ETag.
    location = /v1/policies/edge-69/current.json {
        alias /srv/aleph-policy-feed/edge-69/current.json;
        etag off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
    }
    location / { return 404; }
}
