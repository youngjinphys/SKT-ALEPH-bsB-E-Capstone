<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>피싱 위험 안내</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6fa;
  --card: #fff;
  --text: #172033;
  --muted: #3d4c63;
  --line: #e1e6ef;
  --amber: #9a3412;
  --amber-soft: #fff4e8;
  --amber-line: #e8b07a;
  --fill: #e59a1a;
  --blue: #1d4ed8;
  --blue-hover: #1e40af;
  --track: #e6ebf2;
  --shadow: 0 10px 28px #1520390d;
  --focus: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101722;
    --card: #1a2433;
    --text: #f3f6fb;
    --muted: #c5d0e0;
    --line: #334155;
    --amber: #fdba74;
    --amber-soft: #2c2118;
    --amber-line: #9a6230;
    --fill: #f0b429;
    --blue: #3b82f6;
    --blue-hover: #60a5fa;
    --track: #334155;
    --shadow: none;
    --focus: #93c5fd;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "NanumGothic", sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
.page {
  width: min(680px, calc(100% - 40px));
  margin: 0 auto;
  padding: 48px 0 56px;
}
.accent { width: 44px; height: 5px; border-radius: 99px; background: var(--fill); margin-bottom: 18px; }
.eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--amber); }
h1 {
  margin: 0 0 12px;
  font-size: clamp(28px, 4vw, 38px);
  line-height: 1.28;
  letter-spacing: -.04em;
  word-break: keep-all;
}
.lead { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.65; word-break: keep-all; }
.lead strong { color: var(--text); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px 22px;
  margin-top: 20px;
  box-shadow: var(--shadow);
}
.scoreline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.label { font-size: 14px; font-weight: 700; }
.chip {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 7px;
  border-radius: 99px;
  background: var(--amber-soft);
  color: var(--amber);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
  vertical-align: 1px;
}
.score { font-size: 28px; font-weight: 800; color: var(--amber); letter-spacing: -.04em; }
.score small { font-size: 13px; font-weight: 600; color: var(--muted); }
.meter { height: 10px; background: var(--track); border-radius: 99px; margin: 14px 0 10px; overflow: hidden; }
.fill { height: 100%; width: 72%; background: linear-gradient(90deg, #f0c14a, #e08a16); border-radius: 99px; }
.note, .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; word-break: keep-all; }
.reasons { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
.reasons h2 { margin: 0 0 8px; font-size: 14px; }
.reasons ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.7; }
.actions { margin-top: 20px; display: grid; gap: 10px; }
button, textarea { font: inherit; }
.primary, .risk, .ghost {
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  padding: 12px 16px;
  cursor: pointer;
}
.primary { border: 0; background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; }
.primary:hover { background: var(--blue-hover); }
.risk {
  border: 1px solid var(--amber-line);
  background: var(--amber-soft);
  color: var(--amber);
  font-weight: 700;
  font-size: 14px;
}
.risk:hover { filter: brightness(1.05); }
.hint { text-align: center; }
.textlink {
  justify-self: center;
  border: 0;
  background: none;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  padding: 8px;
  font-size: 13px;
}
.report { display: grid; gap: 8px; margin-top: 4px; }
.report[hidden] { display: none; }
.report label { font-size: 13px; font-weight: 700; }
textarea {
  width: 100%;
  min-height: 88px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  resize: vertical;
}
.ghost {
  width: auto;
  justify-self: start;
  min-height: 42px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font-weight: 700;
  font-size: 14px;
  padding: 10px 16px;
}
.status { min-height: 1.4em; margin: 12px 0 0; font-size: 13px; color: var(--muted); word-break: keep-all; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
@media (max-width: 600px) {
  .page { width: min(680px, calc(100% - 32px)); padding-top: 28px; }
  h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main class="page">
  <div class="accent" aria-hidden="true"></div>
  <p class="eyebrow">SECURITY ADVISORY · 독립 안내 페이지</p>
  <h1>이 이름은 피싱 위험이 있어 안내합니다.</h1>
  <p class="lead">이 화면은 <strong>별도 안내 페이지</strong>입니다. DNS가 원래 HTTPS 탭을 여기로 자동으로 바꾸지는 않습니다. 점수는 시연용이며 차단 판정이 아닙니다.</p>

  <section class="card" aria-label="위험 분석 결과">
    <div class="scoreline">
      <span class="label">피싱 위험도 <span class="chip">시연용</span></span>
      <span class="score"><span id="score">72</span><small> / 100 · <span id="level">주의</span></small></span>
    </div>
    <div class="meter" id="meter" role="progressbar" aria-label="피싱 위험도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72"><div class="fill" id="fill"></div></div>
    <p class="note" id="scoreNote">현재 점수와 탐지 사유는 시연용 예시입니다.</p>
    <div class="reasons">
      <h2>위험 신호</h2>
      <ul>
        <li>공식 기관 주소와 유사한 도메인 형태</li>
        <li>도메인 신뢰도 검증 필요</li>
      </ul>
    </div>
  </section>

  <div class="actions">
    <button class="primary" type="button" id="back">안전한 곳으로 돌아가기 (권장)</button>
    <button class="risk" type="button" id="continue">위험을 감수하고 방문하기</button>
    <p class="hint">계속 방문하면 개인정보 유출이나 금전 피해가 날 수 있습니다. 이 버튼은 권장 행동이 아닙니다.</p>
    <button class="textlink" type="button" id="reportToggle" aria-expanded="false" aria-controls="reportForm">정상 사이트인데 경고가 표시되나요? 오탐 신고</button>
    <form class="report" id="reportForm" hidden>
      <label for="reportMessage">오탐 신고 사유</label>
      <textarea id="reportMessage" maxlength="1000" required placeholder="오탐이라고 생각하는 이유를 입력해 주세요. 비밀번호 등 개인정보는 적지 마세요."></textarea>
      <button class="ghost" type="submit">신고 내용 확인</button>
    </form>
    <p class="status" id="status" role="status"></p>
  </div>
</main>
<script>
const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const raw = Number(params.get("score"));
if (params.has("score") && Number.isFinite(raw) && raw >= 0 && raw <= 100) {
  const score = Math.round(raw);
  document.getElementById("score").textContent = String(score);
  document.getElementById("fill").style.width = score + "%";
  document.getElementById("meter").setAttribute("aria-valuenow", String(score));
  document.getElementById("level").textContent = score >= 80 ? "높음" : score >= 50 ? "주의" : "낮음";
  document.getElementById("scoreNote").textContent = "표시된 점수는 URL 입력값이며 검증된 분석 결과가 아닙니다.";
}
document.getElementById("back").onclick = () => {
  status.textContent = "이전 페이지로 돌아가지 않습니다. 차단하려던 사이트로 다시 들어갈 수 있습니다. 이 탭을 닫아 주세요.";
  window.close();
};
document.getElementById("continue").onclick = () => {
  status.textContent = "시연 모드입니다. 위험 사이트로 이동하지 않습니다. 실제 배포에서는 서버가 검증한 목적지와 정책만 사용하세요.";
};
document.getElementById("reportToggle").onclick = () => {
  const form = document.getElementById("reportForm");
  const open = form.hidden;
  form.hidden = !open;
  document.getElementById("reportToggle").setAttribute("aria-expanded", String(open));
  if (open) document.getElementById("reportMessage").focus();
};
document.getElementById("reportForm").onsubmit = (event) => {
  event.preventDefault();
  status.textContent = "시연 모드입니다. 신고 내용은 이 화면에만 남고 서버로 전송되지 않습니다.";
};
</script>
</body>
</html>
